  - 'GovData: is there a "Plattform fuer Abwaerme" dataset entry and which licence does it declare? DL-DE-BY-2.0 there
    would flip station 4 to PASS'
  - 'Counsel, one question: does DNG s.4(1)/(3) override a CC BY-NC 4.0 notice attached by a federal office to data it
    must publish under s.17(2) S.3 EnEfG, for a derived, non-redistributing history product; and is a scrubbed
    retention of the XLSX (contact columns dropped) sufficient on the personal-data side?'
  - 'The single conversation that turns the option into a product: an e-mail to the BfEE asking for DL-DE-BY-2.0 under
