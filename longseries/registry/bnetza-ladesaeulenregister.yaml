history:
  - date: '2026-09-06'
    status: option
    note: 'Prospect chain on EV charging: the headline AFIR dynamic layer is not an option at any fidelity (granted
      channel and project at full fidelity; archived openly by NVBW/MobiData BW at station fidelity); the register
      the owner assumed archived is the thing that vanishes. Screened at all six stations in option mode; 2a FAIL,
      2b PASS 3/3; churn measured on two editions; skeptic pass confirmed the option and rewrote the deciding fact
      (deletion lags two to four months; XLSX is the primary artefact; 37.6 % of "vanished" IDs are re-registrations;
      97 % of one month''s operator changes were a single E.ON rename). Owner has not yet decided to collect.'
collector:
  built: false
  sources: []
  how_to_build: 'Landing-only source on the chassis, no code change for storage: landing_url
    https://www.bundesnetzagentur.de/DE/Fachthemen/ElektrizitaetundGas/E-Mobilitaet/start.html; discovery by link
    scraping (hrefs on data.bundesnetzagentur.de whose link text starts "Liste der Ladesaeulen"; never construct dated
    URLs); accept_extensions [".csv", ".xlsx"] (the ?__blob=publicationFile aggregate workbook is captured too, 0.4 MB);
    expect_landing_text "Liste der Ladesaeulen"; expect_min_documents 2; declared_cadence P1M (FAQ: "Die Liste wird
    monatlich aktualisiert und steht zum Download zur Verfuegung."); polarity lists_state; min_payload_bytes 300000;
    licence CC-BY-4.0 with licence_evidence_url = the FAQ; poll weekly (--every P7D), conditional GET (ETag and
    Last-Modified present), generous per-request timeout (the host is slow). Carry ~85 MB per edition, ~1 GB/year.
    XLSX FIRST: the June 2026 edition was published as XLSX only (no CSV) - a CSV-only parser misses editions.
    Extraction later, remote (no Beelink dependency): CSV utf-8-sig, ";" delimiter, header at the
    "Ladeeinrichtungs-ID" line, decimal comma in lat/lon, plus an openpyxl path for XLSX-only editions; valid-time =
    "Letzte Aktualisierung vom", transaction-time = download time; diff keyed on Ladeeinrichtungs-ID and EVSE-ID1..6
    (IDs are not recycled); a coordinate-based re-registration matcher (4 dp ~ 11 m) before any "exit" claim; an
    operator-rename / intra-group normaliser before any "Betreiberwechsel" claim; SUPPRESS operator names that do not
    match a legal-entity/trade pattern (natural persons emitted as "natuerliche Person (anonymisiert)" at Kreis
    level). Every poll: count the dated register URLs on the data host that still answer 200 (the deletion-lag
    gauge). Alerts: landing 404 P0, no new file after 45 days P1, payload < 25 MB P1, header line not found P1.
    ~6 h after the skeptic pass (3 h chassis, 3 h parser/matcher/normaliser).'
  not_built:
    - publisher: Bundesnetzagentur, daily "oeffentliche Schnittstelle" (web service)
      why: granted channel - obtained by e-mail with "Voraussetzungen fuer die Nutzung"; PARKED; the monthly file is the
        anonymous public surface and the archive must never depend on the API
    - publisher: Bundesnetzagentur, Ladesaeulenkarte (ArcGIS FeatureServer)
      why: anonymous queries answer "Token Required" (code 499) - walled; owner browser check for date or archive controls
  note: 'TIME-CRITICAL (dated 2026-09-06): the publisher still serves the superseded editions 2026-06-03 (XLSX only),
    2026-07-07 and 2026-07-28 (CSV + XLSX); at the observed lag they disappear around October-November 2026 -
    download them now (nothing enters a repo). The 2026-03-25 and 2026-04-22 editions are already gone and are in
    no capture. Free backfill: Wayback bodies of ~14 editions 2024-02..2026-01 across four filename generations
    (e.g. 2025-05-07.csv memento 35.4 MB; 2025-07-18, 08-26, 10-23, 12-09 CSVs complete; the 2026-01-28 XLSX
    capture truncated at 5 MiB); the Internet Archive captured none of the 2026-03..07 bodies despite >= 60
    landing-page captures in 2026 - the arithmetic moat is contingent on its crawl behaviour. Schleswig-Holstein open
    data holds 24 Land subsets 2022-02..2024-07 (CC BY 4.0). The 2021-23 generations have a different schema (26
    columns, no ID). Attested 2026 editions: 01-28, 03-25, 04-22, 06-03, 07-07, 07-28, 09-01 - no February, May or
    August edition; "monatlich" is the publisher''s word, the observed cadence is three to eight weeks.'
stations:
  s0_refusals:
    result: PASS with a binding design constraint
    tag: HIGH
    note: 'Institutional and physical subjects; derived facts only; no contact. ~3,843 of 11,755 distinct operator
      strings look like natural persons (4,975 rows, 4.3 %; count exact, classification heuristic) - a dated history
      naming a private individual''s charge point is a different processing purpose from the regulator''s publication:
      that slice is BLOCKED unless suppressed; the option survives without it. Vanished-ID counts per operator are
      facts about register rows, never statements about solvency.'
  s1_archive:
    result: PASS for the per-point record; KILL for aggregates
    tag: HIGH
    note: 'Probes exit 0: 11 attested dated files 2025-06-17..2026-01-28 all GONE, and on the older SharedDocs prefix
      10 attested URLs 2024-02..2025-05 all GONE - 21/21 pre-June-2026 URLs across four filename generations; BUT the
      June and July 2026 editions are still LIVE (skeptic HEAD 2026-09-06): deletion lags two to four months, the
      FAQ''s "Loeschung" sentence is about charge points, not files. Orchestrator HEAD 2026-09-06 on two attested
      files 404, current file 200. Publisher keeps aggregate history only ("Historische Entwicklung" sheets since
      2016, Ladeinfrastruktur in Zahlen workbook). No funded panel: NVBW/MobiData BW states a monthly bnetza_api
      intent but 0 rows exist in its history files (incl. the ingest day 2026-08-18) and datastore; the one academic
      crawler (open-energy-data-server) is download-once with if_exists=replace; NLL cleans a monthly series
      internally and publishes aggregates; Eco-Movement/Chargeprice/chargecloud keep their own databases. Retention
      duty: none - LSV of 23.12.2025 ss.1-6 read in full (s.6 is a monthly transmission to the Eichbehoerden) and
      EnWG s.49(4) Nr.2e/2a carry transmission duties only; the published list is courtesy output.'
  s2a_buyers_now:
    result: FAIL
    tag: HIGH
    note: 'Bundeskartellamt (uses the register as population; can request the internal record), CUBOS (diligence,
      episodic), NOW/NLL (builds, does not buy), Eco-Movement/chargecloud (sell their own history) - no three names
      with a recurring budgeted decision on the history today.'
  s2b_buyers_later:
    result: PASS 3/3
    tag: HIGH
    note: 'Comparable: Eco-Movement sells "historical data for all other modules" [HIGH]; Chargeprice history tiers,
      elvah/chargecloud [MED]; North Data / Shovels register-history comparables [MED]. Traded: three CPO portfolio
      transactions in six months (CUBOS: SWARCO 12/2025, ChargeOne 04/2026 out of insolvency, TotalEnergies B2B
      ~6,000 points 08.07.2026) [HIGH]. Disputed: BKartA 01.10.2024 final report - local markets, municipal land
      allocation criticised, the register is the population basis [HIGH]. Indicators: register +15.1 % in 8.7 months;
      NLL "kuenftig haeufiger aktualisiert"; Masterplan II monitoring [HIGH].'
  s3_churn:
    result: PASS (measured)
    tag: HIGH
    note: 'Declared monthly (FAQ); observed three to eight weeks. Measured 2025-12-09 -> 2026-09-01: 4,378
      Ladeeinrichtungen vanished, of which 1,644 (37.6 %) have a new ID at the same coordinates (876 same operator) -
      re-registrations; true exits ~2,700 over 8.7 months (~2.7 %), at month scale 248 and 799 per interval; 19,620
      added (3,312 with pre-2025 commissioning dates); the 5,346 "operator changes" are rename-dominated (3,181 of
      3,275 in one interval = E.ON Drive GmbH -> E.ON Drive Germany GmbH; true transfers an order of magnitude rarer
      and lumpy); public-key changes 86-97 per interval; EVSE-ID changes 2,880. IDs are not recycled. No
      decommissioned status exists in the file (In Betrieb 116,423 / In Wartung 20) - removal is deletion.'
  s4_licence:
    result: PASS (lookup)
    tag: HIGH
    note: 'FAQ: CC BY 4.0, attribution "bundesnetzagentur.de"; Impressum names a (non-existent) "Datenlizenz Deutschland
      - Namensnennung - Version 4.0" for data files plus an access-etiquette clause; no robots on the data host. A
      licence does not license GDPR processing - the suppression rule is the control. Lawyer before the UG touches it:
      yes (natural-person slice; attribution wording on a paid product).'
  s5_withdrawal:
    result: PASS with kill criteria
    tag: HIGH
    note: 'Publisher invites re-use of the file; the map API is token-walled and the daily interface is e-mail-gated
      (the gate covers the "oeffentliche Schnittstelle" too) - the file could be retired behind the API (undated).
      Superseded files persist two to four months - housekeeping, not hostility. Withdrawal in reverse: NVBW monthly
      bnetza_api intent (0 rows seven months on), NLL dashboard extensions, BNetzA''s own aggregate history since 2016;
      the Internet Archive''s crawl decides how much of the past a rival can backfill. Publicity is not a risk: the
      licence requires naming the source. Because the last two to four editions stay live, the wedge (a last-two-files
      change table) has no exclusivity - only history older than ~4 months is exclusive.'
  s6_validation:
    result: option mode, register set; wedge not yet offered
    tag: n/a
    note: Current-demand mode not run.
