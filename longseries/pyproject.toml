[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longseries"
version = "0.1.0"
description = "Long-series capture chassis: poll public sources on a cadence, store raw bytes content-addressed, fail loudly."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
extract = ["pymupdf>=1.24,<2.0"]
test = ["pytest>=8.0,<9.0", "pymupdf>=1.24,<2.0"]
dev = ["ruff>=0.6", "pip-tools>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# Bugs, not style: pyflakes, the E4/E7/E9 subset, bugbear, bandit, import order. E501 is
# off on purpose — this code prefers one complete sentence to a wrapped one — and the
# blind `except Exception` in the heartbeat and schedule paths are deliberate; each says why.
select = ["F", "E4", "E7", "E9", "B", "S", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]   # asserts, fake keys, tmp paths in fixtures
