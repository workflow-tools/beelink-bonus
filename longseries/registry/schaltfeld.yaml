stations:
  s1_archive:
    result: PASS
    tag: HIGH
    note: 'No publisher or vendor archive: TSOs publish the current edition only; the cabinet bill BR-Drs.
      471/26 s.17c has no retention or archive duty (zero hits for archiv|histori|vorherige Fassung in
      81 pp); Reg. (EU) 2019/943 Art. 50(4a) requires monthly updates, no retention. Capacitypedia (ENTSO-E/DSO
      Entity, May 2026) links to national maps and archives nothing. Coverage map NOT built: web.archive.org
      blocked from the agent containers - owner runs archive-probe from the Beelink.'
  s2a_buyers_now:
    result: FAIL
    tag: HIGH
    note: No organisation could be shown consulting a prior edition; none existed before 2026-04-01. Named
      developers (Kyon Energy, BayWa r.e., Statkraft), consultancy (Roedl & Partner), vendors (deeeper.technology,
      Nefino) are plausible users, not evidenced buyers of history.
  s2b_buyers_later:
    result: PASS 3/3
    tag: HIGH
    note: 'Comparable: GridTracker (US interconnection-queue history, paid tier) [MED]; PVcase Prospect
      and Searchland sell a consolidated CURRENT view [HIGH]. Disputed: BNetzA BK6-25-287 of 2026-05-04,
      BESS Germany 1 GmbH v 50Hertz, decided on free Schaltfelder and queue rank [HIGH]. Traded: Green
      Flexibility/Kajoni 750 MW conditioned on the maturity process [HIGH]. Leading indicators: SMARD
      2026-08-20, 18,158 storage requests in 2025 (+194 %), 54.2 GW of 573.5 GW approved [HIGH].'
  s3_churn:
    result: PASS
    tag: HIGH
    note: Today one edition per Reifegrad cycle (Amprion Stand April 2026, TransnetBW Stand 05/2026, unchanged
      on 2026-09-05); statutory monthly once s.17c is in force. Superseded values stay decision-relevant
      12-36 months for developers, lenders, disputes.
  s4_licence:
    result: PASS (carried from 2026-09-03, not re-run)
    tag: MED
    note: Non-binding courtesy publications, no licence statement; derived facts only; robots.txt and
      terms snapshotted per poll. Lawyer before the UG touches it; collect as Einzelunternehmen.
  s5_withdrawal:
    result: PASS with named risks
    tag: HIGH
    note: 'Subject objection nil (switchgear bays). Publisher withdrawal low and falling (publication
      becomes a legal duty). Withdrawal in reverse is the live risk: Commission Notice C/2025/6703 urges
      single national platforms and forward-looking maps; VNBdigital sits under a s.14e(7) BNetzA Festlegung
      power; BNetzA supply-quality map "wird fortlaufend weiterentwickelt".'
  s6_validation:
    result: option mode, not started
    tag: n/a
    note: Wedge not yet offered to anyone. Current-demand mode not run.
