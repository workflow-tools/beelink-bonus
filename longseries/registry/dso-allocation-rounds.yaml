premium:
  setup_hours: 7
  monthly_eur: 3
  note: Berlin 2 h (incl. the <img> chassis extension), WWN 2 h, NRM 1 h, wesernetz 1 h, Netze BW watch 1 h; Hamburg
    excluded (browser-only host); payload < 3 MB per edition; legend read by eye once a year
wedge: 'A public "Grossanschluss-Rationierungsmonitor" - one dated table across the family (DSO | threshold | grid area
  | published MW/MVA this round | window or Stichtag | status open / allocated / postponed | last change) with a change
  alert when any page changes (new round, figure published, Stichtag set, postponement); needs no archive; offered free
  to a DC/BESS site scout, one of the law firms writing the commentary and one trade journalist. The table names the
  publisher and the figure, never the endpoint or the poll.'
kill_criteria:
  - s.17c EnWG-E enacted with a BNetzA-standardised format that carries history, or VNBdigital / netztransparenz.de /
    BNetzA publishes a DSO allocation register with prior rounds (withdrawal in reverse)
  - Any publisher adds a history or version control (a Berlin "Archiv"; WWN keeps prior Stichtag columns beside the
    new one; wesernetz appends the next result below the last instead of replacing it - then drop that source from
    collection and keep it in the table)
  - OLG Duesseldorf strikes the Repartierung down (VI-5 Kart 4/26 [V]) and Berlin ends the series with no successor
    publication by 2027-04-30 - stop collecting, keep the 2025 archive
  - 'Churn gate: no second figure-bearing edition observed anywhere in the family by 2027-01-31 (Berlin mid-October
    2026, WWN''s next pre-Stichtag publication, wesernetz by 2026-11-01)'
  - Fewer than three DSOs publishing a per-round figure by 2027-09-06 - downgrade the family to validation-only
  - Nobody has used the wedge by 2027-09-06 (every refusal logged with a date)
  - A funded party publishes the same cross-DSO table
  - A machine-readable TDM reservation or a terms change on any host - stop polling that host
  - A leading indicator reverses - a publisher returns to Windhund, or the rounds are oversubscribed no longer
review_date: '2026-10-15'
review_note: 'One week after the OLG Duesseldorf hearing of 2026-10-08: does Berlin publish its mid-October 2026 figures,
  at the same image paths or new ones? Then family checkpoints - WWN''s next pre-Stichtag publication (six weeks
  before whichever Stichtag is announced), Netze BW window 2026-11-01, wesernetz Stichtag 2026-12-15 (result
  replace-or-append by 2027-03-01), NRM results 2027-04-15; churn gate 2027-01-31; full re-run of stations 1, 2b and 5
  on 2027-09-06.'
route: validation-only
ceiling:
  eur_per_year_low: 6000
  eur_per_year_high: 50000
  tag: LOW
  note: 5-10 monitor subscribers at EUR 100-300/month plus at most one OEM licence to a siting-data vendor at EUR
    10-30k/yr; about EUR 50k/yr if everything works, one-hundredth of the ambition; a validation unit on the portfolio
    path and a set of rows the portfolio's DC-siting table needs anyway. Floor - two subscribers at EUR 150/month.
    Odds - a wedge conversation within twelve months about one in three if ten named e-mails are sent, under one in
    ten if not; a history-buying conversation about one in six within 24 months, concentrated on the OLG decision and
    the parliamentary fate of s.17c, either of which can also end the series.
owner_checks:
  - 'Hamburger Energienetze from a browser: find the Fair Grid / Repartierung page - is a capacity figure or Stichtag
    published, in what form? Then run archive-probe on it from the laptop (the container is IP-blocked)'
  - 'WWN after the next Stichtag is announced: is the "07/2026" column replaced or kept beside the new one? (decides
    whether the table vanishes)'
  - 'Stromnetz Berlin after 2026-10-08: does the "Zusammenstellung" with legend and Topogramm reappear, at the same
    /images/ paths or new ones? Any "Archiv" or year selector a non-browser client does not see?'
  - 'wesernetz Netzportal (hausanschluss.wesernetz.de, productId=40) without registering: is the 2027 pre-round figure
    shown anonymously once published (deadline 2026-11-01), and which JSON does the app load (DevTools -> Network)?
    Between 2027-01-15 and 2027-03-01: does the 2026/27 result replace or sit beside the 2025/26 block?'
  - 'Netze BW after 2026-11-01: does any public page list the regions opened for the Punkteverfahren or the MW on
    offer outside the Kundenportal? If yes, the row reopens as a capacity series'
  - 'Bayernwerk / SH Netz portals (2026-10-12): comparable round figures? Browser-only either way - project, not option'
  - 'swb.de press list with the 2026 year filter: any release carrying "17 Anschlussanfragen" / "315 MW" / "75 MW"?'
