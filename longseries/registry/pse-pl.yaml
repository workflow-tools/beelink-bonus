kill_criteria:
- PSE publishes dated prior editions, or the URL gains a date segment with prior files retained
- energyai.pl or another funded party starts mirroring PSE's PDF under capture-dated filenames
- URE or a national platform mandates central publication with retention
- The PDF moves behind a login or a portal
- Last-Modified does not move for two consecutive quarters
- Nobody has used the wedge by the review date
