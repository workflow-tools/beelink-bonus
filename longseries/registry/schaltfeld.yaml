premium:
  setup_hours: 0
  monthly_eur: 5
  note: Collector exists; the euros are the VPS share once collection moves off the Beelink per ADR-001
    Q1
wedge: A change alert per substation (before/after state with both editions attached) plus a consolidated
  four-TSO table; offer to two developers and one consultancy, free; usage is the evidence.
kill_criteria:
  - A central archive or versioned publication of the maps is mandated or published (BNetzA Festlegung
    under s.14e(7); the s.14e platform gains a capacity layer; netztransparenz.de adds the maps to its
    Altdaten-Archiv; any TSO ships an "aeltere Ausgaben" list)
  - A statutory retention or history duty appears in the parliamentary text of BR-Drs. 471/26 (grep archiv|histori|vorherige
    Fassung|aufbewahr on every new version)
  - EU law turns out to require retention, a common format or central publication (Art. 50(4a) checked,
    does not; Directive (EU) 2019/944 Art. 31(3) not yet read)
  - BNetzA's supply-quality map grows a connection-capacity layer
  - 'The series stops changing: two consecutive s.17c editions with no transition at any tracked substation'
  - Nobody has used the wedge by the review date
  - 'Licence changes: a TSO adds a licence statement barring re-use, or a machine-readable TDM reservation
    on the map paths'
  - 'A leading indicator reverses: SMARD monitoring shows requests and approvals falling year on year'
  - Capacitypedia moves from links to hosted data, or publishes harmonised capacity parameters the operators
    adopt
  - BNetzA issues a s.14e(7) Festlegung adding a hosting-capacity layer to VNBdigital, or acts on the
    "single national platforms" recommendation
  - Any German TSO publishes expected capacity for coming years, supplying the trend free
