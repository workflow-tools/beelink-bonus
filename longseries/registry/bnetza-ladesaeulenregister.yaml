premium:
  setup_hours: 6
  monthly_eur: 1
  note: ~85 MB per edition (CSV + XLSX + workbook), ~1 GB/year; 3 h chassis plus 3 h for the XLSX parser, the
    re-registration matcher and the rename normaliser (skeptic); extraction runs remote
wedge: A monthly "Register-Aenderungen" table and alert per Landkreis and per legal-entity operator (new points,
  withdrawn points, operator changes, power upgrades, public-key rotations) computed from the last two files, cited
  to bundesnetzagentur.de; offered free to two or three people near the future buyer (a consolidator's corporate
  development contact, an e-mobility M&A adviser, a Landkreis e-mobility coordinator).
kill_criteria:
  - NVBW's historised resource starts carrying bnetza_api rows monthly AND BNetzA or NLL publish per-point history or
    stop deleting dated files (a probe shows a superseded file LIVE, or the start page grows an "Archiv" link) -
    re-screen station 1
  - Two consecutive months with no new dated file linked from start.html (the file retired behind the keyed daily
    interface) - series ended
  - Licence or attribution wording changes, or a robots.txt / TDM reservation appears on either host
  - Nobody outside the owner has opened the change table or the alert twice by the review date
  - The consolidation indicator reverses - no German CPO portfolio transaction in twelve months
  - A schema change drops Ladeeinrichtungs-ID without a mapping
  - A MobiData BW daily file contains bnetza_api rows at EVSE level (check one file per quarter)
  - The deletion lag grows to twelve months or more (twelve dated editions live at once on the data host - measured
    every poll) - the publisher is effectively archiving; re-run station 1 and close unless the wedge has users
  - The Internet Archive captures ten or more of twelve edition bodies in a rolling year (CDX on the data host) - the
    arithmetic moat is nil; collect at hosting cost only, no product claim on exclusivity
  - The re-registration share exceeds 50 % of vanished IDs in any twelve-month window (same-coordinate match) - the
    "exit" series is ID churn; re-describe the product or close
  - A single legal-entity rename exceeding 80 % of a month's operator changes is aggregated as one event (design
    rule); if true transfers stay below ~20 per month for six months, drop the Betreiberwechsel sub-signal
  - Three consecutive editions without a refreshed CSV - XLSX-first parser (design); no refreshed XLSX for two
    editions - series ended
  - An anonymous keyless OpenAPI endpoint appears on the "oeffentliche Schnittstelle" - add it as a second source,
    never a dependency; the monthly file retired while the API stays keyed - kill
