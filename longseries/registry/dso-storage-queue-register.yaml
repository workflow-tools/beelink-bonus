premium:
  setup_hours: 2.5
  monthly_eur: 2
  note: two landing-only HTML pages; EWE no-store means a full 257 KB GET per day (~7.7 MB/month); Netze BW 20 KB
wedge: A free normalised "DSO Grossspeicher-Warteschlange" board - operator | figure as published | basis | reservation
  state | deposit rule | first seen | last changed - seeded from today's pages and the persisting dated press figures,
  with a change alert when any polled sentence changes; offered free to two BESS developers and one energy-law
  practice. The alert names the operator and the change, never the endpoint or the poll.
kill_criteria:
  - EWE, Netze BW or Mitnetz add a "Stand:" date plus an archive or older-versions control; or a statute (the
    BR-Drs. 471/26 successor text, BT-Drs. 21/7734, the Art. 31(3) transposition) adds a retention or history duty -
    grep archiv|histori|vorherige Fassung|aufbewahr on every new text
  - A funded party publishes the same series - SMARD adds a per-operator or per-Land breakdown (re-check the 2027
    edition ~Aug 2027); BNetzA/VNBdigital gains a capacity-under-request layer; BDEW repeats its survey as a dated
    per-operator table; BVES's s.17a Nr.8 is enacted with a central publisher
  - 'The series stops changing: neither the EWE figure or state sentences nor the Netze BW state sentence changes by
    2026-12-14 (the 90-day gate; Netze BW''s window opening on 2026-11-01 is counted but the EWE figure is the one
    that matters); thereafter STALE for two consecutive P6M periods on EWE'
  - Nobody outside the owner has used the board or the alert by the review date (log every refusal with a date)
  - A 2b indicator reverses - project-rights trading in approved BESS stops, or SMARD 2027 shows DSO requests falling
    below commitments
  - A Disallow on the polled paths, a machine-readable TDM reservation, or terms barring automated access on any host
    - stop polling that host
  - A host moves behind a Cloudflare challenge - browser-only = project; drop that source
  - EWE removes the figure or the reservation-stop sentence and publishes nothing dated in its place for two
    consecutive cycles - the option reduces to Netze BW's shape; re-screen
review_date: '2027-03-31'
review_note: 'Brought forward from the twelve-month default by the publisher''s own dated event: Netze BW "Erste
  Vergabe: voraussichtlich bis zum 1. Maerz 2027" (window 1 Nov-31 Dec 2026), coinciding with the TSO cycle-1 offer
  phase. Checkpoints: 2026-09-25 Bundesrat first passage; 2026-11-01 Netze BW window opens; 2026-12-14 churn gate.'
route: portfolio
ceiling:
  eur_per_year_low: 12000
  eur_per_year_high: 72000
  tag: LOW
  note: An alert/feed at EUR 100-300/month x 10-20 subscribers on its own; realistically one extra layer inside the
    Schaltfeld register's alert for the same 50-150 developers, project-rights buyers, law practices and lender
    advisers - not many-small, not a route to the ambition. Two customers at EUR 150/month clear the floor. Odds the
    buyer conversation happens ~30 % within twelve months if the board is e-mailed to ten named organisations, ~5 % if
    only published.
