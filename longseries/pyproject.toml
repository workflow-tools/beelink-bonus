[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longseries"
version = "0.1.0"
description = "Long-series capture chassis: poll public sources on a cadence, store raw bytes content-addressed, fail loudly."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
