    result: PASS 2/3
    tag: MED
    note: 'Disputed: Polish connection refusals (odmowa) are the most litigated in the EU and turn on
      what capacity was published at application date. Traded: PL storage pipelines change hands with
      the connection as the asset. Comparable: GridTracker [MED].'
  s3_churn:
    result: PASS
    tag: HIGH
    note: 'CORRECTED from the lane report: the statutory floor is quarterly, quoted verbatim - "PSE S.A.
      jest zobowiazany aktualizowac powyzsze informacje co najmniej raz na kwartal". Observed practice
      is faster (Last-Modified 2026-08-31, document stamped STAN NA 31 SIERPNIA 2026). Record both.'
  s4_licence:
    result: NOT RUN
    tag: n/a
    note: No licence statement located. Derived facts only; never redistribute the PDF.
  s5_withdrawal:
    result: PASS with named risks
    tag: MED
    note: Withdrawal in reverse is live - Polish law already extends the same duty to 110 kV DSOs, and
