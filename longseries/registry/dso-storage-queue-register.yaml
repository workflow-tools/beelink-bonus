  s2a_buyers_now:
    result: FAIL
    tag: HIGH
    note: aurivolt needs the CURRENT reservation state of the operator where a project sits; Roedl & Partner and Raue
      brief on one figure at a time; BESS Germany 1 is a litigant - three names from poor-recurrence rows.
  s2b_buyers_later:
    result: PASS 3/3
    tag: HIGH
    note: 'Comparable: GridTracker sells US interconnection-queue history (paid tier) [MED]. Disputed: BK6-25-325
      (30.03.2026, 18 pp read): petitioner argued the operator "haette zudem Netzdaten zur Verfuegung stellen muessen,
      die ... eine Ueberpruefung der Ablehnung ... ermoeglicht haetten"; chamber: "aus technischer Sicht plausibel"
      [HIGH]. Traded: aurivolt 2026-09-03 buys 1-10 MW project rights "gegen eine Einmalzahlung", 300 MW by end-2027
      [HIGH]. Indicators: SMARD 2026-08-20 (17,775 DSO requests / 406.8 GW in 2025); Netze BW 2026-08-13 (>20 GW HS +
      2.2 GW MS, >93 % storage); EWE 25 -> 34 GW in six months; BR-Drs. 471/26 ss.17c/17f; BT-Drs. 21/7734 s.17(2c)
      [HIGH].'
  s3_churn:
    result: PASS with the 90-day gate (EWE); PASS thin (Netze BW)
    tag: HIGH on artefacts, LOW on cadence
    note: EWE declares no cadence; one overwrite of the figure and two edits of the state text observed across
      2025-10-17 / 2026-04-15 / 2026-09-06. Netze BW is annual by construction with window dates on the page. A
      superseded reservation state stays decision-relevant 12-36 months (inferred from the BK6 timeline).
  s4_licence:
    result: PASS pending advice
    tag: MED
    note: No licence statement on any page or Impressum; Mitnetz's rechtliche Hinweise carry a general copyright
      notice that carves out statutory uses; robots ewe-netz.de and mitnetz-strom.de 404, netze-bw.de allows the
      polled paths; no ai.txt/llms.txt/tdmrep on any host (no machine-readable s.44b(3) reservation). One sentence
      stating the operator's own aggregate is not a database on the obvious reading (ss.87a-87b read). Defence
      not-a-database + derived facts only + no conflict with exploitation. Lawyer before the UG touches it.
  s5_withdrawal:
    result: PASS with four dated mechanisms in the kill criteria
    tag: HIGH
    note: 'Subject institutional. Posture: all three hosts answer an honest UA with 200; the E.ON-group DSOs, SH Netz
      and TenneT are challenge-walled (cannot be covered). Withdrawal in reverse: Directive 2019/944 Art. 31(3) as
      amended by 2024/1711 (DSOs publish "capacity under connection request" at least quarterly, transposition due
      2025-01-17, no retention); BR-Drs. 471/26 s.17c map and s.17f joint reservation rules (208 DSOs, IT-supported
      reservation system) - state could migrate into portals [LOW]; BT-Drs. 21/7734 s.17(2c) website duty for
      reservations, no archive; BVES 2026-07-22 p.12 asks for anonymised procedure data as s.17a(1) S.5 Nr.8.'
  s6_validation:
    result: option mode, register set; wedge not yet offered
    tag: n/a
    note: 90-day churn gate to 2026-12-14 (collection start assumed 2026-09-15). Current-demand mode not run.
