history:
  - date: '2026-09-06'
    status: option
    note: 'Prospect chain on the German storage queue: nine of ten candidates killed because the publisher is the
      archivist (netztransparenz keeps superseded Reifegrad documents live, SMARD and MaStR archive, BK6 decisions
      are promulgated). The one thin survivor: undated queue and reservation-state sentences on reachable DSO pages,
      overwritten in place. Screened at all six stations in option mode: 2a FAIL, 2b PASS 3/3; the Mitnetz sub-signal
      dropped (rules, not state). Owner has not yet decided to collect.'
collector:
  built: false
  sources: []
  how_to_build: 'Two landing-only sources on the chassis, no code change: (1) source_id de-dso-ewe-netz-grossspeicher,
    publisher EWE NETZ GmbH, landing_url https://www.ewe-netz.de/einspeiser/strom/ihr-netzanschluss/grossspeicher,
    accept_extensions [], expect_landing_text "Anschlussanfragen fuer Grossspeicher" (present live and in both
    attested captures), declared_cadence P6M [LOW - the publisher states none: "Derzeit", "Momentan", "Sobald ...
    neue Kapazitaeten ... werden wir diese Informationen transparent veroeffentlichen"; observed one overwrite of
    the figure and two edits of the state text in eleven months], polarity lists_where_not_possible ("zurzeit keine
    neuen Netzverknuepfungspunkte reservieren"), min_payload_bytes 100000 (live 257,477 B; cache-control no-store,
    no validators - every daily poll is a full GET, ~7.7 MB/month), licence none-analysed,
    licence_evidence_url https://www.ewe-netz.de/meta/impressum; poll daily (--every P1D). (2) source_id
    de-dso-netze-bw-grossspeicher, publisher Netze BW GmbH, landing_url
    https://www.netze-bw.de/stromeinspeisung/stromspeicher-anmelden/grossspeicher, accept_extensions [],
    expect_landing_text "Anmeldezeitraum", declared_cadence P1Y ("einmal jaehrlich ausgewertet"; window
    2026-11-01..12-31, first allocation ~2027-03-01), polarity lists_state, min_payload_bytes 15000 (live 20,074 B),
    licence none-analysed, licence_evidence_url https://www.netze-bw.de/impressum; poll daily. Visible-text diff on
    both (the chassis already does this for the TSO landing pages). ~2.5 h. Confirm the chassis does not trip
    small-payload or staleness alarms on a no-store page at P1D against P6M.'
  not_built:
    - publisher: MITNETZ STROM (Grossspeicher and Reservierung pages)
      why: the pages carry reservation RULES (reservation only at Planungsreife; 7 months plus a 3-year extension) and
        one qualitative sentence added in H1 2026 - no figure, no open/closed state; the merge's URL was a sales page
        for Mitnetz's own modular storage product; the ~120 GW figure lives only in a dated zfk report (2026-04-09);
        rules will be promulgated-ish under s.17f EnWG-E
    - publisher: E.ON-group DSOs (Bayernwerk Netz, Westnetz, Avacon Netz, E.DIS Netz), HanseWerk/SH Netz, TenneT
      why: Cloudflare managed challenge or no answer to an honest User-Agent (posture recorded 2026-09-05) - browser-only
        = project, not option; a large share of the 17,775 DSO storage requests sits with them (coverage bias)
    - publisher: Austrian Power Grid AG (markt.apg.at, the Anschlussantraege-per-Bundesland column)
      why: handed over from the DSO grid-connection chain as EVIDENCE - a genuine monthly stock series (Einspeisung
        5,964 -> 27,544 MW, Bezug 4,132 -> 29,889 MW, Sept 2024 -> Aug 2026, six free Wayback editions) - but not
        screened to verdict here; Austrian law (UrhG AT ss.76c-76e, no commercial TDM exception, browse-wrap
        commercial-use bar in apg.at Nutzungsbedingungen) needs Austrian counsel first; a dated re-screen if the
        owner wants a DACH queue board
  note: Free backfill is exactly the series for EWE (two attested captures, 2025-10-17 "ueber 25 Gigawatt" without the
    stop sentence; 2026-04-15 "ueber 34 Gigawatt" with it) and thin for Netze BW (three captures, pre-August text).
    The dated press figures (4-UeNB 2026-02-05, Mitnetz 2026-04-09, Netze BW 2026-08-13, SMARD 2026-08-20) persist
    at their publishers and seed the wedge; they are not the series.
