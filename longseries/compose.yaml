# One container per long series, all from the same image. Add a series = add a
# YAML under sources/ and a service block here. No code change.
#
#   docker compose run --rm setup           # the install: checks, .env, data-root marker (safe to re-run)
#   docker compose up -d --build            # start every collector
#   docker compose run --rm amprion poll /sources/amprion.yaml --data /data   # one-off poll
#   docker compose run --rm amprion show /sources/amprion.yaml --data /data   # latest manifest + alerts
#
# Secrets/personal data stay out of the repo: put LONGSERIES_CONTACT and
# LONGSERIES_HEARTBEAT_URL in a .env file next to this compose.yaml (gitignored).
#
# All services mount the SAME data root. The store namespaces by source_id itself
# ({root}/{source_id}/blobs|index.jsonl|captures), so the host tree matches the
# README and one rsync of $LONGSERIES_DATA moves every series.

x-collector: &collector
  build: .
  image: longseries:local
  restart: unless-stopped
  # Non-root, as the OWNER of the data root: `setup` reads the mounted directory's
  # uid/gid into .env, so nothing in the asset is written by root and no uid is guessed.
  user: "${LONGSERIES_UID:-1000}:${LONGSERIES_GID:-1000}"
  # A collector needs no capability, no writable image filesystem and no more than a
  # few hundred MB (one payload is capped at 256 MB in the adapter). Take all of it away.
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
  deploy:
    resources:
      limits:
        memory: 1g
  # PID 1 is python, which has no SIGTERM handler, and the kernel DISCARDS SIGTERM
  # sent to PID 1: every `docker stop` stalled 10 s and then SIGKILLed. Landing that
  # inside a poll leaves a capture directory with no manifest. tini forwards signals.
  init: true
  # A crash loop writes a log line per iteration forever; the default json-file
  # driver has no ceiling and the host disk is the archive.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  env_file:
    - path: .env
      required: false
  environment:
    - LONGSERIES_CONTACT

services:
  amprion:
    <<: *collector
    container_name: longseries-amprion
    environment:
      - LONGSERIES_CONTACT
      - LONGSERIES_HEARTBEAT_URL=${LONGSERIES_HEARTBEAT_URL_AMPRION:-}   # one healthchecks check per source: a dead source must not hide behind a live sibling
    command: ["schedule", "/sources/amprion.yaml", "--data", "/data", "--every", "P1D"]
    volumes:
      - ./sources:/sources:ro
      # create_host_path: false — if the data root is not there, Docker must REFUSE
      # to invent an empty directory for it. An unmounted root is indistinguishable
      # from a fresh install: every document is re-captured as NEW, no staleness
      # alarm can fire (they are all gated on there being a history), the watchdog
      # goes green, and the captures written under the mountpoint are shadowed the
      # moment the real disk comes back. Run `mkdir -p ./data` (or point
      # LONGSERIES_DATA at the real disk) before the first `up`.
      - type: bind
        source: ${LONGSERIES_DATA:-./data}
        target: /data
        bind:
          create_host_path: false

  transnetbw:
    <<: *collector
    container_name: longseries-transnetbw
    environment:
      - LONGSERIES_CONTACT
      - LONGSERIES_HEARTBEAT_URL=${LONGSERIES_HEARTBEAT_URL_TRANSNETBW:-}   # one healthchecks check per source: a dead source must not hide behind a live sibling
    command: ["schedule", "/sources/transnetbw.yaml", "--data", "/data", "--every", "P1D"]
    volumes:
      - ./sources:/sources:ro
      # create_host_path: false — if the data root is not there, Docker must REFUSE
      # to invent an empty directory for it. An unmounted root is indistinguishable
      # from a fresh install: every document is re-captured as NEW, no staleness
      # alarm can fire (they are all gated on there being a history), the watchdog
      # goes green, and the captures written under the mountpoint are shadowed the
      # moment the real disk comes back. Run `mkdir -p ./data` (or point
      # LONGSERIES_DATA at the real disk) before the first `up`.
      - type: bind
        source: ${LONGSERIES_DATA:-./data}
        target: /data
        bind:
          create_host_path: false

  fiftyhertz:
    <<: *collector
    container_name: longseries-50hertz
    environment:
      - LONGSERIES_CONTACT
      - LONGSERIES_HEARTBEAT_URL=${LONGSERIES_HEARTBEAT_URL_50HERTZ:-}   # one healthchecks check per source: a dead source must not hide behind a live sibling
    command: ["schedule", "/sources/50hertz.yaml", "--data", "/data", "--every", "P1D"]
    volumes:
      - ./sources:/sources:ro
      # create_host_path: false — if the data root is not there, Docker must REFUSE
      # to invent an empty directory for it. An unmounted root is indistinguishable
      # from a fresh install: every document is re-captured as NEW, no staleness
      # alarm can fire (they are all gated on there being a history), the watchdog
      # goes green, and the captures written under the mountpoint are shadowed the
      # moment the real disk comes back. Run `mkdir -p ./data` (or point
      # LONGSERIES_DATA at the real disk) before the first `up`.
      - type: bind
        source: ${LONGSERIES_DATA:-./data}
        target: /data
        bind:
          create_host_path: false

  # `docker compose run --rm setup` — the install. Validates every YAML in sources/,
  # marks the data root, creates one healthchecks check per source and writes .env.
  # HEALTHCHECKS_API_KEY is read from THIS shell only and never written to .env
  # (.env is handed to every collector container). Lives in a profile so `up`
  # never starts it; `run` enables the profile by itself. Safe to re-run.
  setup:
    <<: *collector
    profiles: ["setup"]
    restart: "no"
    user: "0:0"          # root for this one run: it writes into the host user's directories and chowns what it wrote
    # Root without capabilities cannot write into a directory it does not own (found by running
    # this in a container on 2026-09-12): give the one-off setup back exactly the two it needs.
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    container_name: longseries-setup
    command: ["setup", "/sources", "--data", "/data", "--env-file", "/work/.env"]
    environment:
      - LONGSERIES_CONTACT
      - LONGSERIES_DATA
      - HEALTHCHECKS_API_KEY
      - HEALTHCHECKS_API_URL
    volumes:
      - ./sources:/sources:ro
      - .:/work
      - type: bind
        source: ${LONGSERIES_DATA:-./data}
        target: /data
        bind:
          create_host_path: false
